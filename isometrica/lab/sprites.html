<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprite gallery</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d1f22;
        color: #ddd;
        font: 12px monospace;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: #26292d;
        border-bottom: 1px solid #34383d;
      }
      header a {
        color: #7fc4c4;
      }
      header h1 {
        font-size: 13px;
        margin: 0 8px 0 0;
      }
      input,
      select,
      button {
        font: inherit;
        color: #eee;
        background: #1d1f22;
        border: 1px solid #4a5056;
        padding: 4px 6px;
      }
      button {
        background: #2f6f6f;
        border-color: #4a9a9a;
        cursor: pointer;
      }
      #filter {
        flex: 1 1 180px;
        min-width: 120px;
      }
      .layout {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      nav {
        width: 170px;
        flex: none;
        overflow-y: auto;
        border-right: 1px solid #34383d;
      }
      nav button {
        display: flex;
        justify-content: space-between;
        width: 100%;
        background: none;
        border: none;
        border-bottom: 1px solid #2a2d31;
        padding: 7px 10px;
        text-align: left;
        color: #ccc;
      }
      nav button.on {
        background: #2f6f6f;
        color: #fff;
      }
      nav small {
        color: #7f8a8f;
      }
      #grid {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 8px;
      }
      .card {
        background: var(--bg);
        border: 1px solid #34383d;
        padding: 4px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
      }
      .card:hover {
        border-color: #7fc4c4;
      }
      .card canvas {
        image-rendering: pixelated;
        display: block;
      }
      #status {
        padding: 6px 12px;
        color: #9aa;
        border-top: 1px solid #34383d;
        min-height: 1.4em;
      }
      #more {
        width: 100%;
        margin-top: 6px;
      }
      #zoom {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        cursor: zoom-out;
      }
      #zoom canvas {
        image-rendering: pixelated;
        background: var(--bg);
        max-width: 92vw;
        max-height: 80vh;
      }
      #zoom div {
        color: #ddd;
        text-align: center;
        word-break: break-all;
        padding: 0 16px;
      }
      @media (max-width: 600px) {
        nav {
          width: 120px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="./">isometrica</a> / sprites</h1>
      <input id="filter" placeholder="filter: e.g. cottage thatch r0" />
      <select id="look" title="how it is painted">
        <option value="">lit</option>
        <option value="night">night</option>
      </select>
      <select id="scale" title="how big">
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="3">3x</option>
      </select>
      <select id="bg" title="behind it">
        <option value="#26292d">dark</option>
        <option value="#e8e4da">light</option>
        <option value="#6a9a4a">grass</option>
      </select>
    </header>
    <div class="layout">
      <nav id="gens"></nav>
      <div id="grid"></div>
    </div>
    <div id="status"></div>
    <div id="zoom">
      <canvas></canvas>
      <div></div>
    </div>
    <script type="module" src="./sprites.js"></script>
  </body>
</html>
