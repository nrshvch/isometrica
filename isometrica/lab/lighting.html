<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lighting lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d1f22;
        color: #ddd;
        font: 12px monospace;
        overflow: hidden;
      }
      #frame {
        display: block;
        image-rendering: pixelated;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.7);
        line-height: 1.9;
      }
      #panel label {
        display: block;
      }
      #stats {
        white-space: pre;
        color: #9fe39f;
      }
    </style>
  </head>
  <body>
    <canvas id="frame"></canvas>
    <div id="panel">
      <label
        >mode
        <select id="mode">
          <option value="lit">baked sun (today)</option>
          <option value="seq" selected>deferred, two loops</option>
          <option value="int">deferred, one loop, two canvases</option>
          <option value="faces">three faces, three loops</option>
          <option value="faces1">three faces, one loop</option>
        </select>
      </label>
      <label
        >show
        <select id="show">
          <option value="frame">frame</option>
          <option value="map">map (faces: what looks up)</option>
          <option value="light">light (faces: what looks -y)</option>
        </select>
      </label>
      <label
        >tiles
        <select id="size">
          <option value="12">12 × 12</option>
          <option value="24" selected>24 × 24</option>
          <option value="40">40 × 40</option>
          <option value="64">64 × 64</option>
        </select>
      </label>
      <label
        >time
        <input id="time" type="range" min="0" max="24" step="0.05" value="9"
      /></label>
      <label><input id="animate" type="checkbox" checked /> run the day</label>
      <label><input id="pan" type="checkbox" checked /> pan the camera</label>
      <div id="stats"></div>
    </div>
    <script type="module" src="./lighting.js"></script>
  </body>
</html>
