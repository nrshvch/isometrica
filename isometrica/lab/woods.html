<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Woods map</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1d1f22;
        color: #ddd;
        font: 13px monospace;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p {
        color: #9aa;
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        align-items: center;
        margin-bottom: 10px;
      }
      .bar label {
        color: #9aa;
      }
      button,
      select,
      input {
        font: inherit;
        color: #eee;
        background: #26292d;
        border: 1px solid #4a5055;
        padding: 4px 8px;
      }
      input {
        width: 6em;
      }
      button {
        background: #2f6f6f;
        border-color: #4a9a9a;
        cursor: pointer;
      }
      button.on {
        background: #b5532f;
        border-color: #e07a50;
      }
      canvas {
        display: block;
        width: 100%;
        height: 560px;
        background: #191b1e;
        cursor: grab;
        image-rendering: pixelated;
      }
      canvas.dragging {
        cursor: grabbing;
      }
      #legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        margin-top: 10px;
      }
      #legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #legend i {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 1px solid #0006;
      }
      #legend small {
        color: #7f8a8f;
      }
      #status {
        color: #7f8a8f;
        margin-top: 8px;
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Woods map</h1>
      <p>
        Where the world grows its trees, and which, a pixel or a few for every
        tile - worked out here in the page from the same code the games use
        (src/core/woods.js, on the ground of src/core/terrain.js). Drag to look
        round; the shares are of the trees in sight.
      </p>
      <div class="bar">
        <span>
          <button id="trees" class="on">Trees</button>
          <button id="woods">Woods</button>
        </span>
        <label>
          tile
          <select id="scale">
            <option value="1">1px</option>
            <option value="2" selected>2px</option>
            <option value="3">3px</option>
            <option value="4">4px</option>
            <option value="6">6px</option>
          </select>
        </label>
        <label>x <input id="x" type="number" /></label>
        <label>y <input id="y" type="number" /></label>
        <button id="home">The starting city</button>
      </div>
      <canvas id="map"></canvas>
      <div id="legend"></div>
      <div id="status"></div>
    </main>
    <script type="module" src="./woods.js"></script>
  </body>
</html>
