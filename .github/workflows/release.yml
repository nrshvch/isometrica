# Release one app to production: tag the current main as <app>/vX.Y.Z and run that app's deploy
# workflow on the tag, which deploys it with `wrangler deploy --env production`.
#
# Actions → "release" → Run workflow (from main), pick the app, give the version.
#
# The same release from a laptop, without this workflow:
#   git tag city-sim/v0.3.0 origin/main && git push origin city-sim/v0.3.0
#
# A tag pushed with GITHUB_TOKEN does not start other workflows, so this one starts the deploy
# itself, with `gh workflow run` (a workflow_dispatch, which GITHUB_TOKEN may start).
name: release

on:
  workflow_dispatch:
    inputs:
      app:
        description: What to release
        type: choice
        options: [city-sim, food-rider, lab]
        required: true
      version:
        description: Version, X.Y.Z (no "v")
        type: string
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.app }} v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the request
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main; this run is on ${REF}."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version \"${VERSION}\" is not X.Y.Z."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Tag
        id: tag
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="${APP}/v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "::error::${tag} already exists. To deploy it again, run the ${APP} workflow on that tag."
            exit 1
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          case "$APP" in
            city-sim) workflow=city-sim.yml ;;
            food-rider) workflow=food-rider.yml ;;
            lab) workflow=isometrica.yml ;;
          esac
          gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          {
            echo "### Tagged ${TAG}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Deploying with [${workflow}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/${workflow}) on \`${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
