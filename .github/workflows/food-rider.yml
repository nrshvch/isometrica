# Build and deploy food-rider, the delivery game, to Cloudflare Workers (static assets), through
# _deploy.yml. Its Workers are defined in food-rider/wrangler.jsonc. No domain of its own yet:
# workers.dev.
#
# - push a tag food-rider/vX.Y.Z → production, Worker "food-rider"
#                                  (or Actions → "release" → food-rider, which tags main and runs this)
# - push to main                 → dev, Worker "food-rider-dev"
# - push to any other branch     → Preview on the "food-rider-dev" Worker
#                                  (https://<branch>-food-rider-dev.isometrica.workers.dev)
# - manual run                   → Actions → "food-rider" → Run workflow; on a food-rider/v* tag it
#                                  deploys that release to production again (a rollback)
#
# Branch pushes run only when food-rider, or what it is built on - isometrica, the engine - changes.
# Tag pushes always run: GitHub does not look at `paths` for tags.
name: food-rider

on:
  push:
    branches: ["**"]
    tags: ["food-rider/v*"]
    paths:
      - "food-rider/**"
      - "isometrica/**"
      - "engine/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/food-rider.yml"
      - ".github/workflows/_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      app: food-rider
      directory: food-rider
      build: npm run build -w food-rider
      target: ${{ startsWith(github.ref, 'refs/tags/food-rider/v') && 'production' || github.ref == 'refs/heads/main' && 'dev' || 'preview' }}
      production-site: https://food-rider.isometrica.workers.dev/
      dev-site: https://food-rider-dev.isometrica.workers.dev/
