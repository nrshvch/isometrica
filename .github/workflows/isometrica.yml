# Build and deploy isometrica's lab - the pages to look at and listen to what its generators
# make: sprites, sounds, music, lighting, traffic - to Cloudflare Workers (static assets), through
# _deploy.yml. Its Workers are defined in isometrica/wrangler.jsonc. No domain of its own:
# workers.dev. The traffic testbed runs before every build.
#
# - push a tag lab/vX.Y.Z      → production, Worker "isometrica-lab"
#                                (or Actions → "release" → lab, which tags main and runs this)
# - push to main               → dev, Worker "isometrica-lab-dev"
# - push to any other branch   → Preview on the "isometrica-lab-dev" Worker
#                                (https://<branch>-isometrica-lab-dev.isometrica.workers.dev)
# - manual run                 → Actions → "isometrica" → Run workflow; on a lab/v* tag it
#                                deploys that release to production again (a rollback)
#
# Branch pushes run only when isometrica, or the engine it is built on, changes.
# Tag pushes always run: GitHub does not look at `paths` for tags.
name: isometrica

on:
  push:
    branches: ["**"]
    tags: ["lab/v*"]
    paths:
      - "isometrica/**"
      - "engine/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/isometrica.yml"
      - ".github/workflows/_deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      app: lab
      directory: isometrica
      test: npm run test:traffic -w isometrica
      build: npm run build:lab -w isometrica
      target: ${{ startsWith(github.ref, 'refs/tags/lab/v') && 'production' || github.ref == 'refs/heads/main' && 'dev' || 'preview' }}
      production-site: https://isometrica-lab.isometrica.workers.dev/
      dev-site: https://isometrica-lab-dev.isometrica.workers.dev/
