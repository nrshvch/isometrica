# Build and deploy the legacy city builder (v0.2.1) to Cloudflare Workers (static assets).
# The Worker is defined in wrangler.jsonc.
#
# This is the frozen `legacy` branch: the game as it was before isometrica became a monorepo.
# Development goes on in main; this branch only takes the odd fix.
#
# - push to legacy  → Worker "legacy" (legacy.peeps.land), `wrangler deploy`
# - manual run      → Actions → "Deploy legacy" → Run workflow (on the legacy branch)
name: Deploy legacy

on:
  push:
    branches: [legacy]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-legacy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build and deploy legacy
    # A manual run from another branch would deploy that branch's code to legacy.peeps.land.
    if: github.ref == 'refs/heads/legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: env.CLOUDFLARE_CONFIGURED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy

      - name: Summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$CLOUDFLARE_CONFIGURED" != "true" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set, so nothing was deployed."
            echo "Build passed; deployment skipped (Cloudflare secrets not configured)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            {
              echo "### Deployment failed"
              echo "See the \"Deploy to Cloudflare Workers\" step. \"No access to the specified resource\" means the API token lacks **Workers Scripts: Edit**."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deployed legacy"
              echo "- Site: https://legacy.peeps.land/"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
